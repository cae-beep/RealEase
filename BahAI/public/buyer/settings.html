<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Settings - BahAI Real Estate</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
      --primary: #0b2e52;
      --primary-dark: #001F3F;
      --primary-light: #002f3f;
      --secondary: #1976d2;
      --accent: #ff9800;
      --text-dark: #1a202c;
      --text-light: #718096;
      --bg-light: #f8fafc;
      --bg-white: #ffffff;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --danger: #dc2626;
      --warning: #d97706;
      --success: #059669;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', Arial, sans-serif;
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      color: var(--text-dark);
      display: flex;
      min-height: 100vh;
    }

    /* Main wrapper */
    .container {
      flex: 1;
      margin-left: 280px;
      padding: 30px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .page-header h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .page-header p {
      color: var(--text-light);
      font-size: 16px;
    }

    /* Settings Layout */
    .settings-grid {
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 30px;
    }

    /* Settings Sidebar */
    .settings-sidebar {
      background: var(--bg-white);
      border-radius: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 20px 0;
      height: fit-content;
      position: sticky;
      top: 30px;
    }

    .settings-nav {
      list-style: none;
    }

    .settings-nav-item {
      margin: 5px 15px;
    }

    .settings-nav-link {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 500;
      border-radius: 10px;
      transition: all 0.3s ease;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
    }

    .settings-nav-link:hover {
      background: var(--bg-light);
    }

    .settings-nav-link.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      font-weight: 600;
    }

    .settings-nav-link i {
      margin-right: 12px;
      font-size: 16px;
      width: 20px;
      text-align: center;
    }

    /* Settings Content */
    .settings-content {
      background: var(--bg-white);
      border-radius: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 30px;
    }

    .settings-section {
      margin-bottom: 40px;
    }

    .section-header {
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--border);
    }

    .section-header h2 {
      font-size: 22px;
      font-weight: 600;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-header p {
      color: var(--text-light);
      font-size: 14px;
      margin-top: 5px;
    }

    /* Form Styles */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .field {
      margin-bottom: 20px;
    }

    .field-full {
      grid-column: 1 / -1;
    }

    .field label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-dark);
      font-size: 14px;
    }

    .field-hint {
      font-size: 12px;
      color: var(--text-light);
      margin-top: 4px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
      background: var(--bg-white);
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(11, 46, 82, 0.1);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
      line-height: 1.5;
    }

    /* Profile Section */
    .profile-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
      padding: 20px;
      background: var(--bg-light);
      border-radius: 12px;
    }

    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 32px;
      font-weight: 600;
    }

    .profile-info h3 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .profile-info p {
      color: var(--text-light);
      font-size: 14px;
    }

    /* Action Buttons */
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      box-shadow: var(--shadow);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .btn-secondary {
      background: var(--bg-light);
      color: var(--text-dark);
      border: 2px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--border);
    }

    /* Success Message */
    .success-message {
      background: #d1fae5;
      border: 1px solid #a7f3d0;
      color: #065f46;
      padding: 15px 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .success-message.show {
      display: flex;
    }

    /* Responsive Design */
    @media (max-width: 1024px) {
      .container {
        margin-left: 50px;
      }
    }

    @media (max-width: 768px) {
      .container {
        margin-left: 0;
        padding: 20px;
      }
      
      .settings-grid {
        grid-template-columns: 1fr;
      }
      
      .settings-sidebar {
        position: static;
        margin-bottom: 20px;
      }
      
      .form-grid {
        grid-template-columns: 1fr;
      }
      
      .profile-header {
        flex-direction: column;
        text-align: center;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 15px;
      }
      
      .settings-content {
        padding: 20px;
      }
    }
</style>
</head>

<body>
<!-- Include Sidebar -->
<div id="sidebar-container"></div>

<!-- Main -->
<div class="container">
  <div class="topbar">
    <div class="page-header">
      <h1>Profile Settings</h1>
      <p>Manage your personal information and account details</p>
    </div>
  </div>

  <!-- Success Message -->
  <div class="success-message" id="successMessage">
    <span>✓</span>
    <span id="successText">Profile updated successfully!</span>
  </div>

  <div class="settings-grid">
    <!-- Settings Sidebar - Only Profile -->
    <div class="settings-sidebar">
      <ul class="settings-nav">
        <li class="settings-nav-item">
          <button class="settings-nav-link active">
            <i>👤</i> Profile
          </button>
        </li>
      </ul>
    </div>

    <!-- Settings Content -->
    <div class="settings-content">
      <!-- Profile Section -->
      <div class="settings-section active" id="profile-section">
        <div class="section-header">
          <h2>👤 Profile Settings</h2>
          <p>Manage your personal information and account details</p>
        </div>

        <div class="profile-header">
          <div class="profile-avatar" id="userAvatar">U</div>
          <div class="profile-info">
            <h3 id="userName">Loading...</h3>
            <p id="userEmail">Loading...</p>
          </div>
        </div>

        <form id="profileForm">
          <div class="form-grid">
            <div class="field">
              <label for="firstName">First Name</label>
              <input type="text" id="firstName" placeholder="Enter your first name">
            </div>
            <div class="field">
              <label for="lastName">Last Name</label>
              <input type="text" id="lastName" placeholder="Enter your last name">
            </div>
            <div class="field field-full">
              <label for="email">Email Address</label>
              <input type="email" id="email" placeholder="Enter your email address">
            </div>
            <div class="field">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" placeholder="+63 XXX XXX XXXX">
            </div>
            <div class="field">
              <label for="company">Company</label>
              <input type="text" id="company" placeholder="Your company name">
            </div>
            <div class="field field-full">
              <label for="bio">Bio</label>
              <textarea id="bio" placeholder="Tell us about yourself and your experience in real estate..."></textarea>
              <div class="field-hint">Brief description about yourself (max 200 characters)</div>
            </div>
          </div>
          
          <div style="display: flex; gap: 15px; margin-top: 30px;">
            <button type="submit" class="btn btn-primary">
              💾 Save Changes
            </button>
            <button type="button" class="btn btn-secondary" onclick="resetProfileForm()">
              🔄 Reset
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Sidebar Loader -->
<script>
// Load sidebar
fetch('sidebar.html')
  .then(response => response.text())
  .then(html => {
    document.getElementById('sidebar-container').innerHTML = html;
    // Set active state for current page
    const links = document.querySelectorAll('.sidebar-link');
    links.forEach(link => {
      if (link.getAttribute('href') === 'settings.html') {
        link.classList.add('active');
      }
    });
  })
  .catch(error => console.error('Error loading sidebar:', error));
</script>

<!-- Firebase Script -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, updateDoc
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCIfzneDzWVveG8p_0mywoA9D9F5AyzZX4",
  authDomain: "bahai-1b76d.firebaseapp.com",
  projectId: "bahai-1b76d",
  storageBucket: "bahai-1b76d.appspot.com",
  messagingSenderId: "646878644941",
  appId: "1:646878644941:web:5b4ccc3412250337587784"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUser = null;
let userData = {};

// Load user data
async function loadUserData() {
  currentUser = auth.currentUser;
  if (!currentUser) return;

  try {
    // Update UI with basic user info
    document.getElementById('userName').textContent = currentUser.displayName || 'User';
    document.getElementById('userEmail').textContent = currentUser.email;
    document.getElementById('userAvatar').textContent = (currentUser.displayName || 'U').charAt(0).toUpperCase();
    
    // Load additional user data from Firestore
    const userDoc = await getDoc(doc(db, "users", currentUser.uid));
    if (userDoc.exists()) {
      userData = userDoc.data();
      populateForm(userData);
    }
  } catch (error) {
    console.error("Error loading user data:", error);
  }
}

function populateForm(data) {
  // Profile form
  document.getElementById('firstName').value = data.firstName || '';
  document.getElementById('lastName').value = data.lastName || '';
  document.getElementById('email').value = data.email || currentUser.email || '';
  document.getElementById('phone').value = data.phone || '';
  document.getElementById('company').value = data.company || '';
  document.getElementById('bio').value = data.bio || '';
}

// Profile form submission
document.getElementById('profileForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  try {
    const userDocRef = doc(db, "users", currentUser.uid);
    await updateDoc(userDocRef, {
      firstName: document.getElementById('firstName').value,
      lastName: document.getElementById('lastName').value,
      email: document.getElementById('email').value,
      phone: document.getElementById('phone').value,
      company: document.getElementById('company').value,
      bio: document.getElementById('bio').value,
      updatedAt: new Date()
    });

    showSuccess('Profile updated successfully!');
  } catch (error) {
    console.error("Error updating profile:", error);
    alert('Error updating profile: ' + error.message);
  }
});

// Reset profile form
window.resetProfileForm = function() {
  populateForm(userData);
};

// Success message function
function showSuccess(message) {
  const successEl = document.getElementById('successMessage');
  document.getElementById('successText').textContent = message;
  successEl.classList.add('show');
  
  setTimeout(() => {
    successEl.classList.remove('show');
  }, 3000);
}

// Require login and load user data
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
  } else {
    loadUserData();
  }
});
</script>
</body>
</html>
