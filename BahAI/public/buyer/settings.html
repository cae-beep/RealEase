<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Profile - BahAI Real Estate</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
    :root {
      --primary: #0b2e52;
      --primary-dark: #071e38;
      --primary-light: #1e3a5f;
      --secondary: #d4af37;
      --accent: #d4af37;
      --accent-dark: #b8860b;
      --text-dark: #1a202c;
      --text-light: #718096;
      --bg-light: #f1f5f9;
      --bg-white: #ffffff;
      --border: #e2e8f0;
      --card-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --border-radius: 16px;
      --border-radius-sm: 12px;
      --danger: #dc2626;
      --warning: #d97706;
      --success: #059669;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', Arial, sans-serif;
      background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      color: var(--text-dark);
      display: flex;
      min-height: 100vh;
    }

    .mobile-menu-toggle {
      display: none;
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1001;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border: none;
      width: 50px;
      height: 50px;
      border-radius: var(--border-radius-sm);
      font-size: 24px;
      cursor: pointer;
      box-shadow: var(--shadow-lg);
    }
    @media (max-width: 1024px) {
      .mobile-menu-toggle { display: flex; align-items: center; justify-content: center; }
    }

    .container {
      flex: 1;
      margin-left: 280px;
      padding: 30px;
      transition: margin-left 0.3s ease;
    }
    @media (max-width: 1024px) {
      .container { margin-left: 0; }
    }

    /* Hero Section - matches buyer dashboard */
    .hero-section {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      border-radius: var(--border-radius);
      padding: 50px 40px;
      margin-bottom: 40px;
      position: relative;
      overflow: hidden;
    }
    .hero-section::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0,0V46.29c47.79,22.2,103.59,32.17,158,28,70.36-5.37,136.33-33.31,206.8-37.5C438.64,32.43,512.34,53.67,583,72.05c69.27,18,138.3,24.88,209.4,13.08,36.15-6,69.85-17.84,104.45-29.34C989.49,25,1113-14.29,1200,52.47V0Z" opacity=".25" fill="white"/></svg>');
      background-size: cover;
      opacity: 0.1;
    }
    .hero-section h1 {
      font-size: 2.8rem;
      font-weight: 700;
      margin-bottom: 15px;
      line-height: 1.2;
      position: relative;
      z-index: 1;
    }
    .hero-section p {
      font-size: 1.1rem;
      opacity: 0.9;
      margin-bottom: 0;
      position: relative;
      z-index: 1;
    }

    /* Profile Layout */
    .settings-grid {
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 30px;
    }

    .settings-sidebar {
      background: var(--bg-white);
      border-radius: var(--border-radius);
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border);
      padding: 20px 0;
      height: fit-content;
      position: sticky;
      top: 30px;
    }

    .settings-nav {
      list-style: none;
    }

    .settings-nav-item {
      margin: 5px 15px;
    }

    .settings-nav-link {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 500;
      border-radius: var(--border-radius-sm);
      transition: all 0.3s ease;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
    }

    .settings-nav-link:hover {
      background: rgba(212, 175, 55, 0.1);
    }

    .settings-nav-link.active {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      font-weight: 600;
    }

    .settings-nav-link.active i {
      color: white;
    }

    .settings-nav-link i {
      margin-right: 12px;
      font-size: 16px;
      width: 20px;
      text-align: center;
      color: var(--accent);
    }

    .settings-content {
      background: var(--bg-white);
      border-radius: var(--border-radius);
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border);
      padding: 30px;
    }

    .settings-section {
      margin-bottom: 40px;
    }

    .section-header {
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--border);
    }

    .section-header h2 {
      font-size: 22px;
      font-weight: 600;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-header h2 i {
      color: var(--accent);
    }

    .section-header p {
      color: var(--text-light);
      font-size: 14px;
      margin-top: 5px;
    }

    /* Form Styles */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .field {
      margin-bottom: 20px;
    }

    .field-full {
      grid-column: 1 / -1;
    }

    .field label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-dark);
      font-size: 14px;
    }

    .field-hint {
      font-size: 12px;
      color: var(--text-light);
      margin-top: 4px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: var(--border-radius-sm);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
      background: var(--bg-white);
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
      line-height: 1.5;
    }

    /* Profile Section */
    .profile-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
      padding: 20px;
      background: var(--bg-light);
      border-radius: 12px;
    }

    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 32px;
      font-weight: 600;
    }

    .profile-info h3 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .profile-info p {
      color: var(--text-light);
      font-size: 14px;
    }

    /* Action Buttons */
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: var(--border-radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      box-shadow: var(--shadow);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(11, 46, 82, 0.35);
    }

    .btn-secondary {
      background: var(--bg-light);
      color: var(--text-dark);
      border: 2px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--border);
      border-color: var(--accent);
    }

    .success-message {
      background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
      border: 1px solid rgba(5, 150, 105, 0.3);
      color: #065f46;
      padding: 15px 20px;
      border-radius: var(--border-radius-sm);
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .success-message.show {
      display: flex;
    }

    /* Responsive Design */
    @media (max-width: 1024px) {
      .container {
        margin-left: 50px;
      }
    }

    @media (max-width: 768px) {
      .container {
        margin-left: 0;
        padding: 20px;
      }
      
      .settings-grid {
        grid-template-columns: 1fr;
      }
      
      .settings-sidebar {
        position: static;
        margin-bottom: 20px;
      }
      
      .form-grid {
        grid-template-columns: 1fr;
      }
      
      .profile-header {
        flex-direction: column;
        text-align: center;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 15px;
      }
      
      .settings-content {
        padding: 20px;
      }
    }
</style>
</head>

<body>
<button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu">
  <i class="fas fa-bars"></i>
</button>
<div id="sidebar-container"></div>

<div class="container">
  <section class="hero-section">
    <h1><i class="fas fa-user"></i> Profile</h1>
    <p>Manage your personal information and account details</p>
  </section>

  <div class="success-message" id="successMessage">
    <i class="fas fa-check-circle"></i>
    <span id="successText">Profile updated successfully!</span>
  </div>

  <div class="settings-grid">
    <div class="settings-sidebar">
      <ul class="settings-nav">
        <li class="settings-nav-item">
          <button class="settings-nav-link active" type="button">
            <i class="fas fa-user"></i> Profile
          </button>
        </li>
      </ul>
    </div>

    <div class="settings-content">
      <div class="settings-section active" id="profile-section">
        <div class="section-header">
          <h2><i class="fas fa-user"></i> Profile</h2>
          <p>Manage your personal information and account details</p>
        </div>

        <div class="profile-header">
          <div class="profile-avatar" id="userAvatar">U</div>
          <div class="profile-info">
            <h3 id="userName">Loading...</h3>
            <p id="userEmail">Loading...</p>
          </div>
        </div>

        <form id="profileForm">
          <div class="form-grid">
            <div class="field">
              <label for="firstName">First Name</label>
              <input type="text" id="firstName" placeholder="Enter your first name">
            </div>
            <div class="field">
              <label for="lastName">Last Name</label>
              <input type="text" id="lastName" placeholder="Enter your last name">
            </div>
            <div class="field field-full">
              <label for="email">Email Address</label>
              <input type="email" id="email" placeholder="Enter your email address">
            </div>
            <div class="field">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" placeholder="+63 XXX XXX XXXX">
            </div>
            <div class="field">
              <label for="company">Company</label>
              <input type="text" id="company" placeholder="Your company name">
            </div>
            <div class="field field-full">
              <label for="bio">Bio</label>
              <textarea id="bio" placeholder="Tell us about yourself and your experience in real estate..."></textarea>
              <div class="field-hint">Brief description about yourself (max 200 characters)</div>
            </div>
          </div>
          
          <div style="display: flex; gap: 15px; margin-top: 30px;">
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-save"></i> Save Changes
            </button>
            <button type="button" class="btn btn-secondary" onclick="resetProfileForm()">
              <i class="fas fa-undo"></i> Reset
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
document.getElementById('mobileMenuToggle').addEventListener('click', function() {
  var sidebar = document.querySelector('.sidebar');
  if (sidebar) sidebar.classList.toggle('active');
});
document.addEventListener('click', function(e) {
  if (window.innerWidth <= 1024 && e.target.closest('.sidebar-link')) {
    var sidebar = document.querySelector('.sidebar');
    if (sidebar) sidebar.classList.remove('active');
  }
});
window.addEventListener('resize', function() {
  var sidebar = document.querySelector('.sidebar');
  if (window.innerWidth > 1024 && sidebar) sidebar.classList.remove('active');
});

fetch('sidebar.html')
  .then(function(r) { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(function(html) {
    document.getElementById('sidebar-container').innerHTML = html;
    var links = document.querySelectorAll('.sidebar-link');
    links.forEach(function(link) {
      if (link.getAttribute('href') === 'settings.html') link.classList.add('active');
    });
    var logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
      var newBtn = logoutBtn.cloneNode(true);
      logoutBtn.parentNode.replaceChild(newBtn, logoutBtn);
      newBtn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        if (confirm('Are you sure you want to log out?')) window.location.href = '../login.html';
      });
    }
  })
  .catch(function(err) { console.error('Sidebar load error:', err); });
</script>

<!-- Firebase Script -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, updateDoc
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCIfzneDzWVveG8p_0mywoA9D9F5AyzZX4",
  authDomain: "bahai-1b76d.firebaseapp.com",
  projectId: "bahai-1b76d",
  storageBucket: "bahai-1b76d.appspot.com",
  messagingSenderId: "646878644941",
  appId: "1:646878644941:web:5b4ccc3412250337587784"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUser = null;
let userData = {};

// Load user data
async function loadUserData() {
  currentUser = auth.currentUser;
  if (!currentUser) return;

  try {
    // Update UI with basic user info
    document.getElementById('userName').textContent = currentUser.displayName || 'User';
    document.getElementById('userEmail').textContent = currentUser.email;
    document.getElementById('userAvatar').textContent = (currentUser.displayName || 'U').charAt(0).toUpperCase();
    
    // Load additional user data from Firestore
    const userDoc = await getDoc(doc(db, "users", currentUser.uid));
    if (userDoc.exists()) {
      userData = userDoc.data();
      populateForm(userData);
    }
  } catch (error) {
    console.error("Error loading user data:", error);
  }
}

function populateForm(data) {
  // Profile form
  document.getElementById('firstName').value = data.firstName || '';
  document.getElementById('lastName').value = data.lastName || '';
  document.getElementById('email').value = data.email || currentUser.email || '';
  document.getElementById('phone').value = data.phone || '';
  document.getElementById('company').value = data.company || '';
  document.getElementById('bio').value = data.bio || '';
}

// Profile form submission
document.getElementById('profileForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  try {
    const userDocRef = doc(db, "users", currentUser.uid);
    await updateDoc(userDocRef, {
      firstName: document.getElementById('firstName').value,
      lastName: document.getElementById('lastName').value,
      email: document.getElementById('email').value,
      phone: document.getElementById('phone').value,
      company: document.getElementById('company').value,
      bio: document.getElementById('bio').value,
      updatedAt: new Date()
    });

    showSuccess('Profile updated successfully!');
  } catch (error) {
    console.error("Error updating profile:", error);
    alert('Error updating profile: ' + error.message);
  }
});

// Reset profile form
window.resetProfileForm = function() {
  populateForm(userData);
};

// Success message function
function showSuccess(message) {
  const successEl = document.getElementById('successMessage');
  document.getElementById('successText').textContent = message;
  successEl.classList.add('show');
  
  setTimeout(() => {
    successEl.classList.remove('show');
  }, 3000);
}

// Require login and load user data
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
  } else {
    loadUserData();
  }
});
</script>
</body>
</html>
