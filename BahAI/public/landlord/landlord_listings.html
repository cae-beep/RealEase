<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>My Properties - BahAI Real Estate</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../buyer/style.css">
<style>
    :root {
      --primary-gradient: linear-gradient(135deg, #0b2e52 0%, #1e3a5f 100%);
      --primary: #0b2e52;
      --primary-dark: #071e38;
      --primary-light: #1e3a5f;
      --secondary-gradient: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
      --accent-gradient: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
      --card-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      --card-hover-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
      --border-radius: 16px;
      --border-radius-sm: 12px;
      --border-radius-lg: 24px;
      --text-dark: #1a202c;
      --text-light: #718096;
      --bg-light: #f8fafc;
      --bg-white: #ffffff;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { font-family: 'Inter', Arial, sans-serif; background: #f1f5f9; color: var(--text-dark); display: flex; min-height: 100vh; }

    .mobile-menu-toggle {
      display: none;
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1001;
      background: var(--primary-gradient);
      color: white;
      border: none;
      width: 50px;
      height: 50px;
      border-radius: var(--border-radius-sm);
      font-size: 24px;
      cursor: pointer;
      box-shadow: var(--card-hover-shadow);
    }

    .container { flex: 1; margin-left: 280px; padding: 30px; transition: margin-left 0.3s ease; }

    /* Hero Section - matches landlord dashboard */
    .hero-section {
      background: var(--primary-gradient);
      color: white;
      border-radius: var(--border-radius-lg);
      padding: 50px 40px;
      margin-bottom: 40px;
      position: relative;
      overflow: hidden;
    }
    .hero-section::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0,0V46.29c47.79,22.2,103.59,32.17,158,28,70.36-5.37,136.33-33.31,206.8-37.5C438.64,32.43,512.34,53.67,583,72.05c69.27,18,138.3,24.88,209.4,13.08,36.15-6,69.85-17.84,104.45-29.34C989.49,25,1113-14.29,1200,52.47V0Z" opacity=".25" fill="white"/></svg>');
      background-size: cover;
      opacity: 0.1;
    }
    .hero-section h1 { font-size: 2.8rem; font-weight: 700; margin-bottom: 15px; line-height: 1.2; max-width: 800px; position: relative; }
    .hero-section p { font-size: 1.1rem; opacity: 0.9; max-width: 600px; margin-bottom: 20px; position: relative; }
    .hero-stats { display: flex; gap: 30px; margin-top: 30px; flex-wrap: wrap; position: relative; }
    .hero-stat-item { display: flex; align-items: center; gap: 10px; }
    .hero-stat-icon {
      font-size: 1.5rem;
      background: rgba(255,255,255,0.2);
      width: 50px;
      height: 50px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero-stat-value { font-size: 1.5rem; font-weight: 700; }
    .hero-stat-label { font-size: 0.9rem; opacity: 0.8; }

    /* Properties Section */
    .properties-section { margin-bottom: 40px; }
    .properties-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }
    .section-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .section-title i { color: #d4af37; font-size: 1.3rem; }

    .add-button {
      background: var(--primary-gradient);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      white-space: nowrap;
    }
    .add-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
    }

    /* Listings Grid - broker-style cards */
    .listings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 30px;
      margin-top: 25px;
    }
    .listing-card-wrapper { transition: all 0.3s ease; }
    .listing-card-wrapper:hover { transform: translateY(-5px); }
    .listing-card {
      position: relative;
      background: white;
      border-radius: var(--border-radius);
      overflow: hidden;
      box-shadow: var(--card-shadow);
      transition: all 0.3s ease;
      border: 1px solid rgba(0, 0, 0, 0.05);
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .listing-card:hover { box-shadow: var(--card-hover-shadow); }
    .listing-card-image-container {
      position: relative;
      height: 220px;
      overflow: hidden;
    }
    .listing-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    .listing-card:hover .listing-image { transform: scale(1.05); }
    .listing-type-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      color: white;
      z-index: 2;
    }
    .listing-type-badge.rent, .listing-type-badge.lease { background: #10b981; }
    .listing-type-badge.sale { background: #3b82f6; }
    .listing-content {
      padding: 25px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .listing-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 15px;
      gap: 15px;
    }
    .listing-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 8px;
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .listing-price {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary-dark);
      text-align: right;
      min-width: fit-content;
      flex-shrink: 0;
    }
    .listing-location {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-light);
      font-size: 0.9rem;
      margin-bottom: 15px;
    }
    .listing-details {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e5e7eb;
    }
    .detail {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-light);
      font-size: 0.9rem;
    }
    .listing-status {
      display: inline-block;
      padding: 6px 15px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 15px;
    }
    .status-active, .status-available { background: #10b981 !important; color: white !important; }
    .status-pending { background: var(--accent-gradient) !important; color: white !important; }
    .status-sold, .status-rented { background: #ef4444 !important; color: white !important; }
    .status-uploading { background: #e0e7ff; color: #3730a3; }

    .listing-actions {
      display: flex;
      gap: 10px;
      margin-top: auto;
      padding-top: 12px;
      position: relative;
      z-index: 10;
    }
    .action-btn {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .edit-btn {
      background: var(--primary-gradient);
      color: white;
    }
    .edit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(11, 46, 82, 0.4);
    }
    .delete-btn {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }
    .delete-btn:hover {
      background: #dc2626;
      color: white;
      transform: translateY(-2px);
    }
    .card-link-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% - 56px);
      z-index: 1;
      opacity: 0;
      cursor: pointer;
    }

    .loading-state, .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background: white;
      border-radius: var(--border-radius);
      box-shadow: var(--card-shadow);
    }
    .empty-state-icon { font-size: 64px; margin-bottom: 20px; opacity: 0.5; }
    .empty-state h3 { font-size: 20px; margin-bottom: 10px; color: var(--text-dark); }
    .spinner {
      border: 4px solid rgba(212, 175, 55, 0.2);
      border-top: 4px solid #d4af37;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Enhanced Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      backdrop-filter: blur(5px);
    }

    .modal-content {
      background: white;
      border-radius: 20px;
      width: 100%;
      max-width: 900px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    .modal-header {
      padding: 30px 40px 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, #f8fafc 0%, #e9ecef 100%);
    }

    .modal-title-section {
      flex: 1;
    }

    .modal-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .modal-subtitle {
      font-size: 16px;
      color: var(--text-light);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-price {
      font-size: 32px;
      font-weight: 700;
      color: var(--primary);
      text-align: right;
      margin-bottom: 8px;
    }

    .modal-status {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .close-modal {
      background: none;
      border: none;
      font-size: 28px;
      cursor: pointer;
      color: var(--text-light);
      padding: 5px;
      transition: all 0.3s ease;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .close-modal:hover {
      color: var(--text-dark);
      background: var(--bg-light);
    }

    .modal-body {
      padding: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Enhanced Gallery */
    .listing-gallery {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 15px;
      padding: 30px 40px;
      border-bottom: 1px solid var(--border);
    }

    .main-image {
      border-radius: 16px;
      overflow: hidden;
      background: var(--bg-light);
      position: relative;
    }

    .main-image img {
      width: 100%;
      height: 400px;
      object-fit: cover;
      display: block;
    }

    .thumbnails {
      display: grid;
      grid-template-rows: repeat(2, 1fr);
      gap: 15px;
    }

    .thumbnail {
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      background: var(--bg-light);
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }

    .thumbnail:hover {
      transform: scale(1.05);
      border-color: var(--primary);
    }

    .thumbnail.active {
      border-color: var(--primary);
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Enhanced Details Layout */
    .details-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      padding: 30px 40px;
    }

    .detail-section {
      margin-bottom: 30px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
    }

    .section-header h3 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-dark);
    }

    .section-icon {
      width: 40px;
      height: 40px;
      background: var(--primary-gradient);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: white;
    }

    .details-grid {
      display: grid;
      gap: 16px;
    }

    .detail-card {
      background: var(--bg-light);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      transition: all 0.3s ease;
    }

    .detail-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      color: var(--text-light);
      font-weight: 500;
      font-size: 14px;
    }

    .detail-value {
      color: var(--text-dark);
      font-weight: 600;
      text-align: right;
    }

    .highlight-value {
      color: var(--primary);
      font-size: 18px;
      font-weight: 700;
    }

    /* Amenities Styles */
    .amenities-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 15px;
    }

    .amenity-item {
      background: white;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s ease;
    }

    .amenity-item:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
      border-color: var(--primary);
    }

    .amenity-icon {
      width: 24px;
      height: 24px;
      background: var(--primary-light);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: white;
    }

    /* Description Styles */
    .description-content {
      background: var(--bg-light);
      padding: 25px;
      border-radius: 12px;
      line-height: 1.7;
      color: var(--text-dark);
      border: 1px solid var(--border);
    }

    /* Modal Actions */
    .modal-actions {
      display: flex;
      gap: 15px;
      padding: 25px 40px;
      border-top: 1px solid var(--border);
      background: var(--bg-light);
    }

    .modal-btn {
      flex: 1;
      padding: 16px 24px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .modal-edit-btn {
      background: var(--primary-gradient);
      color: white;
      box-shadow: var(--shadow);
    }

    .modal-edit-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .modal-close-btn {
      background: white;
      color: var(--text-dark);
      border: 2px solid var(--border);
    }

    .modal-close-btn:hover {
      background: var(--bg-light);
      border-color: var(--text-light);
    }

    /* Photo Counter */
    .photo-counter {
      position: absolute;
      bottom: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      backdrop-filter: blur(10px);
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .container { margin-left: 0; padding: 25px; padding-top: 80px; }
      .mobile-menu-toggle { display: flex; align-items: center; justify-content: center; }
      .hero-stats { gap: 20px; }
      .hero-section { padding: 40px 30px; }
      .hero-section h1 { font-size: 2.2rem; }
      .details-container { grid-template-columns: 1fr; gap: 30px; }
      .listing-gallery { grid-template-columns: 1fr; }
      .thumbnails { grid-template-columns: repeat(4, 1fr); grid-template-rows: auto; }
    }

    @media (max-width: 768px) {
      .container { padding: 20px; padding-top: 75px; }
      .listings-grid { grid-template-columns: 1fr; gap: 15px; }
      .hero-section h1 { font-size: 1.8rem; }
      .hero-section { padding: 30px 24px; }
      .hero-stats { flex-direction: column; gap: 20px; }
      .modal-header { flex-direction: column; gap: 15px; text-align: center; }
      .modal-price { text-align: center; }
      .modal-actions { flex-direction: column; }
      .listing-gallery, .details-container { padding: 20px; }
      .main-image img { height: 300px; }
      .properties-section-header { flex-direction: column; align-items: stretch; }
    }

    @media (max-width: 480px) {
      .container { padding: 15px; padding-top: 70px; }
      .hero-section { padding: 24px 18px; }
      .hero-section h1 { font-size: 1.5rem; }
      .listing-actions { flex-direction: column; }
      .modal-content {
        width: 100%;
        border-radius: 0;
        max-height: 100vh;
      }
      .modal-overlay {
        padding: 0;
      }
    }
</style>
</head>

<body>
<!-- Mobile Menu Toggle -->
<button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu"><i class="fas fa-bars"></i></button>

<!-- Include Sidebar -->
<div id="sidebar-container"></div>

<!-- Main -->
<div class="container">
  <!-- Hero Section -->
  <div class="hero-section">
    <h1>My Properties</h1>
    <p>Manage your rental properties and track their performance</p>
    <div class="hero-stats">
      <div class="hero-stat-item">
        <div class="hero-stat-icon"><i class="fas fa-building"></i></div>
        <div>
          <div class="hero-stat-value" id="totalListings">0</div>
          <div class="hero-stat-label">Total Properties</div>
        </div>
      </div>
      <div class="hero-stat-item">
        <div class="hero-stat-icon"><i class="fas fa-check-circle"></i></div>
        <div>
          <div class="hero-stat-value" id="activeListings">0</div>
          <div class="hero-stat-label">Active</div>
        </div>
      </div>
      <div class="hero-stat-item">
        <div class="hero-stat-icon"><i class="fas fa-clock"></i></div>
        <div>
          <div class="hero-stat-value" id="pendingListings">0</div>
          <div class="hero-stat-label">Pending</div>
        </div>
      </div>
      <div class="hero-stat-item">
        <div class="hero-stat-icon"><i class="fas fa-key"></i></div>
        <div>
          <div class="hero-stat-value" id="rentedListings">0</div>
          <div class="hero-stat-label">Rented</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Properties Section -->
  <div class="properties-section">
    <div class="properties-section-header">
      <div>
        <h2 class="section-title">
          <i class="fas fa-list"></i>
          My Listings
        </h2>
        <p style="color: var(--text-light); margin-bottom: 0; font-size: 15px;" id="listingsCount">Loading...</p>
      </div>
      <a href="add_property.html" class="add-button">
        <i class="fas fa-plus"></i> Add New Property
      </a>
    </div>
  <!-- Listings Grid -->
    <div class="listings-grid" id="listingsContainer">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Loading properties...</p>
      </div>
    </div>
  </div>
</div>

<!-- Sidebar Loader -->
<script src="../sidebar-user.js"></script>
<script>
// Mobile menu
document.getElementById('mobileMenuToggle').addEventListener('click', function() {
  const sidebar = document.querySelector('.sidebar');
  if (sidebar) {
    sidebar.style.transform = sidebar.style.transform === 'translateX(0px)' ? 'translateX(-100%)' : 'translateX(0px)';
  }
});

// Load sidebar
fetch('sidebar.html')
  .then(response => response.text())
  .then(html => {
    document.getElementById('sidebar-container').innerHTML = html;
    if (typeof window.updateSidebarUserProfile === 'function') window.updateSidebarUserProfile();
    const links = document.querySelectorAll('.sidebar-link');
    links.forEach(link => {
      if (link.getAttribute('href') === 'landlord_listings.html') link.classList.add('active');
    });
    setupLogoutButton();
  })
  .catch(error => console.error('Error loading sidebar:', error));

function setupLogoutButton() {
  const logoutBtn = document.getElementById("logoutBtn");
  if (!logoutBtn) { setTimeout(setupLogoutButton, 100); return; }
  const newLogoutBtn = logoutBtn.cloneNode(true);
  logoutBtn.parentNode.replaceChild(newLogoutBtn, logoutBtn);
  newLogoutBtn.addEventListener("click", function(e) {
    e.preventDefault();
    e.stopPropagation();
    if (confirm("Are you sure you want to log out?")) {
      if (typeof window.performLogout === 'function') window.performLogout();
      else window.location.href = "../login.html";
    }
  });
}
</script>

<!-- Firebase Script -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs, getDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCIfzneDzWVveG8p_0mywoA9D9F5AyzZX4",
  authDomain: "bahai-1b76d.firebaseapp.com",
  projectId: "bahai-1b76d",
  storageBucket: "bahai-1b76d.firebasestorage.app",
  messagingSenderId: "646878644941",
  appId: "1:646878644941:web:5b4ccc3412250337587784"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentListings = [];

// Load current landlord profile (from users collection)
async function loadCurrentUserProfile(user) {
  try {
    const userRef = doc(db, "users", user.uid);
    const userSnap = await getDoc(userRef);
    if (!userSnap.exists()) return;
    const userData = userSnap.data();
    const profileData = {
      fullName: userData.fullName || userData.displayName || userData.name || ((userData.firstName || '') + ' ' + (userData.lastName || '')).trim() || user.email?.split('@')[0] || 'Property Owner',
      email: userData.email || user.email,
      role: userData.role || 'landlord',
      photoURL: userData.photoURL || userData.profilePhotoURL || userData.profilePhoto || userData.profileImage || user.photoURL
    };
    try { localStorage.setItem('userData', JSON.stringify(profileData)); } catch (e) {}
    if (typeof window.updateSidebarUserProfile === 'function') window.updateSidebarUserProfile(profileData);
  } catch (e) { console.warn('Could not load landlord profile:', e); }
}

// Load user's listings
async function loadListings() {
  const user = auth.currentUser;
  if (!user) return;

  const container = document.getElementById('listingsContainer');
  container.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Loading properties...</p></div>';

  try {
    const q = query(
      collection(db, "properties"),
      where("userId", "==", user.uid)
    );
   
    const querySnapshot = await getDocs(q);
    currentListings = [];
   
    querySnapshot.forEach((doc) => {
      currentListings.push({ id: doc.id, ...doc.data() });
    });

    displayListings(currentListings);
    updateStats(currentListings);
   
  } catch (error) {
    console.error("Error loading listings:", error);
  }
}

function displayListings(listings) {
  const container = document.getElementById('listingsContainer');
  const countEl = document.getElementById('listingsCount');
  if (countEl) countEl.textContent = listings.length === 0 ? 'No properties' : `${listings.length} propert${listings.length === 1 ? 'y' : 'ies'}`;

  if (listings.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon"><i class="fas fa-home"></i></div>
        <h3>No Properties Listed</h3>
        <p>You haven't added any properties yet. Start by creating your first listing!</p>
        <a href="add_property.html" class="add-button" style="margin-top: 20px; display: inline-flex;">
          <i class="fas fa-plus"></i> Add Your First Property
        </a>
      </div>
    `;
    return;
  }

  container.innerHTML = listings.map(listing => {
    const photos = listing.photos || listing.imageUrls || [];
    const mainPhoto = photos.length > 0 ? photos[0] : 'https://via.placeholder.com/400x200/0b2e52/white?text=No+Image';
    const type = (listing.type || listing.listingType || 'rent').toLowerCase();
    const price = type === 'sale' ? (listing.salePrice || listing.pricing || listing.price || 0) : (listing.monthlyRent || listing.annualRent || listing.pricing || listing.price || 0);
    const priceLabel = type === 'sale' ? '₱' + price.toLocaleString() : '₱' + price.toLocaleString() + '/mo';
    const badgeClass = type === 'sale' ? 'sale' : (type === 'rent' || type === 'lease') ? 'rent' : 'rent';
    const typeLabel = type === 'sale' ? 'For Sale' : type === 'lease' ? 'For Lease' : 'For Rent';
    const status = listing.status || 'active';
    const statusClass = status === 'pending' ? 'status-pending' : (status === 'rented' || status === 'sold') ? 'status-rented' : 'status-active';

    return `
    <div class="listing-card-wrapper">
      <div class="listing-card" data-listing-id="${listing.id}">
        <a href="property_details.html?id=${listing.id}" class="card-link-overlay" aria-label="View ${(listing.title || '').replace(/"/g, '&quot;')}"></a>
        <div class="listing-card-image-container">
          <span class="listing-type-badge ${badgeClass}">${typeLabel}</span>
          <img src="${mainPhoto}" alt="${(listing.title || '').replace(/"/g, '&quot;')}" class="listing-image">
        </div>
        <div class="listing-content">
          <div class="listing-header">
            <div style="flex:1;min-width:0;">
              <h3 class="listing-title">${listing.title || 'Untitled Property'}</h3>
            </div>
            <div class="listing-price">${priceLabel}</div>
          </div>
          <div class="listing-location">
            <i class="fas fa-map-marker-alt"></i>
            <span>${listing.address || listing.location || 'Location not specified'}</span>
          </div>
          <div class="listing-details">
            <div class="detail"><i class="fas fa-bed"></i> ${listing.bedrooms || 0} beds</div>
            <div class="detail"><i class="fas fa-bath"></i> ${listing.bathrooms || 0} baths</div>
            <div class="detail"><i class="fas fa-ruler-combined"></i> ${listing.floorArea || listing.squareFootage || 'N/A'} sqm</div>
          </div>
          <div class="listing-status ${statusClass}">${status}</div>
          <div class="listing-actions">
            <button class="action-btn edit-btn"><i class="fas fa-edit"></i> Edit</button>
            <button class="action-btn delete-btn"><i class="fas fa-trash-alt"></i> Delete</button>
          </div>
        </div>
      </div>
    </div>
    `;
  }).join('');
}

function updateStats(listings) {
  const total = listings.length;
  const active = listings.filter(l => l.status === 'active').length;
  const pending = listings.filter(l => l.status === 'pending').length;
  const rented = listings.filter(l => l.status === 'rented' || l.status === 'sold').length;

  document.getElementById('totalListings').textContent = total;
  document.getElementById('activeListings').textContent = active;
  document.getElementById('pendingListings').textContent = pending;
  document.getElementById('rentedListings').textContent = rented;
}

// Global functions for buttons
window.editListing = function(id) {
  // Redirect to edit page with the listing ID
  window.location.href = `edit_property.html?id=${id}`;
};

window.deleteListing = async function(id) {
  if (!confirm('Are you sure you want to delete this property? This action cannot be undone.')) return;
 
  try {
    await deleteDoc(doc(db, "properties", id));
    loadListings(); // Reload listings
  } catch (error) {
    console.error("Error deleting listing:", error);
    alert('Error deleting property: ' + error.message);
  }
};

// Event delegation for click handling (same as broker listings)
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('card-link-overlay') || e.target.closest('.card-link-overlay')) {
    const card = e.target.closest('.listing-card');
    const listingId = card ? card.getAttribute('data-listing-id') : null;
    if (listingId) {
      window.location.href = `property_details.html?id=${listingId}`;
    }
  }
  if (e.target.classList.contains('delete-btn') || e.target.closest('.delete-btn')) {
    e.preventDefault();
    e.stopPropagation();
    const button = e.target.classList.contains('delete-btn') ? e.target : e.target.closest('.delete-btn');
    const card = button.closest('.listing-card');
    const listingId = card ? card.getAttribute('data-listing-id') : null;
    if (listingId) deleteListing(listingId);
  }
  if (e.target.classList.contains('edit-btn') || e.target.closest('.edit-btn')) {
    e.preventDefault();
    e.stopPropagation();
    const button = e.target.classList.contains('edit-btn') ? e.target : e.target.closest('.edit-btn');
    const card = button.closest('.listing-card');
    const listingId = card ? card.getAttribute('data-listing-id') : null;
    if (listingId) editListing(listingId);
  }
});

// Require login and load listings
onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "../login.html";
  } else {
    await loadCurrentUserProfile(user);
    loadListings();
  }
});

window.performLogout = async function() {
  try {
    await signOut(auth);
    localStorage.removeItem('userData');
    sessionStorage.removeItem('userData');
    window.location.href = "../login.html";
  } catch (e) {
    console.error('Logout error:', e);
    window.location.href = "../login.html";
  }
};
</script>
</body>
</html>
